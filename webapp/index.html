<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSE Terminal — Dhaka Stock Exchange Analysis</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] },
    colors: { ink:'#0a0e17', panel:'#111725', panel2:'#161e30', line:'#1f2937', up:'#16c784', down:'#ea3943', accent:'#3b82f6', amber:'#f59e0b' }
  }}
}
</script>
<style>
  html{background:#0a0e17}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#283449;border-radius:6px}
  ::-webkit-scrollbar-track{background:#0d1320}
  .tnum{font-variant-numeric:tabular-nums}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .live{animation:pulse 1.6s infinite}
</style>
</head>
<body class="bg-ink text-slate-200 font-sans antialiased">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;
const R = window.Recharts || {};

/* ---------- helpers ---------- */
const api = (p) => fetch(p).then(r => r.json());
const fmt = (v, d=2) => (v===null||v===undefined||isNaN(v)) ? '—' : Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtInt = (v) => (v===null||v===undefined||isNaN(v)) ? '—' : Number(v).toLocaleString('en-US');
const sign = (v) => v>0?'+':'';
const upDown = (v) => v>0?'text-up':v<0?'text-down':'text-slate-400';

const TAG_STYLE = {
  'BUY-WATCH':'bg-up/15 text-up border-up/30',
  'WATCH-DIP':'bg-accent/15 text-accent border-accent/30',
  'WAIT':'bg-amber/15 text-amber border-amber/30',
  'HOLD':'bg-slate-500/15 text-slate-300 border-slate-500/30',
  'NEUTRAL':'bg-slate-600/10 text-slate-400 border-slate-600/30',
  'AVOID':'bg-down/15 text-down border-down/30',
  'NO-DATA':'bg-slate-700/20 text-slate-500 border-slate-700/40',
};
const Tag = ({t}) => <span className={"text-[10px] font-semibold px-2 py-0.5 rounded border "+(TAG_STYLE[t]||TAG_STYLE['NEUTRAL'])}>{t}</span>;

/* ---------- small UI ---------- */
function KPI({label, value, sub, tone}) {
  const toneC = tone==='up'?'text-up':tone==='down'?'text-down':tone==='amber'?'text-amber':'text-slate-100';
  return (
    <div className="bg-panel border border-line rounded-xl p-4">
      <div className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">{label}</div>
      <div className={"text-2xl font-bold mt-1 tnum "+toneC}>{value}</div>
      {sub && <div className="text-xs text-slate-500 mt-0.5">{sub}</div>}
    </div>
  );
}

function Spinner({label}) {
  return <div className="flex items-center gap-3 text-slate-400 text-sm py-10 justify-center">
    <div className="w-5 h-5 border-2 border-slate-600 border-t-accent rounded-full animate-spin"></div>{label||'Loading live DSE data…'}
  </div>;
}

/* ---------- breadth donut ---------- */
function BreadthDonut({b}) {
  if(!R.PieChart) return null;
  const data=[{name:'Advances',value:b.adv,c:'#16c784'},{name:'Declines',value:b.dec,c:'#ea3943'},
    {name:'Unchanged',value:Math.max(0,b.total-b.adv-b.dec),c:'#64748b'}];
  return (
    <R.ResponsiveContainer width="100%" height={170}>
      <R.PieChart>
        <R.Pie data={data} dataKey="value" innerRadius={48} outerRadius={70} paddingAngle={2} stroke="none">
          {data.map((d,i)=><R.Cell key={i} fill={d.c}/>)}
        </R.Pie>
        <R.Tooltip contentStyle={{background:'#111725',border:'1px solid #1f2937',borderRadius:8,fontSize:12}}/>
      </R.PieChart>
    </R.ResponsiveContainer>
  );
}

/* ---------- candidate card ---------- */
function Candidate({r, kind, onPick}) {
  const lv = r.levels || {};
  const flags = [];
  if(r.pe!=null && r.pe>40) flags.push('HIGH P/E');
  if(['B','N','Z'].includes((r.category||'').toUpperCase())) flags.push('Cat '+r.category);
  return (
    <div className="bg-panel border border-line rounded-xl p-4 hover:border-accent/50 transition cursor-pointer" onClick={()=>onPick(r.code)}>
      <div className="flex items-center justify-between">
        <div className="font-bold text-base tracking-wide">{r.code}</div>
        <div className={"text-sm font-semibold tnum "+upDown(r.pct)}>{sign(r.pct)}{fmt(r.pct,1)}%</div>
      </div>
      <div className="text-xs text-slate-500 mt-0.5">{r.sector||'—'}</div>
      <div className="flex items-baseline gap-2 mt-2">
        <span className="text-xl font-bold tnum">{fmt(r.ltp)}</span>
        <span className="text-[11px] text-slate-500">LTP · {fmt(r.value_mn,1)}mn vol</span>
      </div>
      <div className="grid grid-cols-3 gap-2 mt-3 text-center">
        <div><div className="text-[10px] text-slate-500">P/E</div><div className="text-sm tnum">{fmt(r.pe,1)}</div></div>
        <div><div className="text-[10px] text-slate-500">Div yld</div><div className="text-sm tnum">{fmt(r.div_yield,1)}%</div></div>
        <div><div className="text-[10px] text-slate-500">Cat</div><div className="text-sm">{r.category||'—'}</div></div>
      </div>
      {flags.length>0 && <div className="mt-2 flex gap-1 flex-wrap">{flags.map(f=><span key={f} className="text-[10px] bg-amber/15 text-amber px-1.5 py-0.5 rounded">⚠ {f}</span>)}</div>}
      <div className="mt-3 pt-3 border-t border-line text-xs space-y-1">
        <div className="text-slate-400">{r.reason}</div>
        {kind==='buy'
          ? <div className="text-slate-300"><b className="text-up">Plan:</b> entry dip <span className="tnum">{fmt(lv.support)}</span> / break <span className="tnum">{fmt(lv.resistance)}</span> · stop <span className="tnum text-down">{fmt(lv.stop)}</span> · target <span className="tnum text-up">{fmt(lv.target)}</span></div>
          : <div className="text-slate-300"><b className="text-accent">Watch:</b> pullback <span className="tnum">{fmt(lv.support)}</span> / confirm above <span className="tnum">{fmt(lv.resistance)}</span> on volume</div>}
      </div>
    </div>
  );
}

/* ---------- stock detail modal ---------- */
function StockModal({code, onClose}) {
  const [c,setC]=useState(null); const [err,setErr]=useState(null);
  useEffect(()=>{ setC(null); api('/api/company?code='+code).then(d=>d.error?setErr(d.error):setC(d.company)).catch(e=>setErr(''+e)); },[code]);
  return (
    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-panel2 border border-line rounded-2xl w-full max-w-2xl max-h-[88vh] overflow-auto" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between p-5 border-b border-line sticky top-0 bg-panel2">
          <div><div className="text-2xl font-bold">{code}</div><div className="text-xs text-slate-500">{c?.sector||''} · Dhaka Stock Exchange</div></div>
          <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl leading-none">×</button>
        </div>
        {err && <div className="p-6 text-down">Error: {err}</div>}
        {!c && !err && <Spinner/>}
        {c && <div className="p-5">
          <div className="flex items-baseline gap-3">
            <span className="text-3xl font-bold tnum">{fmt(c.ltp)}</span>
            <span className={"text-lg font-semibold tnum "+upDown(c.pct_change)}>{sign(c.pct_change)}{fmt(c.pct_change,1)}%</span>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
            {[['P/E',fmt(c.pe,1)],['EPS',fmt(c.eps_basic)],['Div yield',fmt(c.div_yield,1)+'%'],['Category',c.market_category||'—'],
              ['Mkt cap (mn)',fmtInt(c.market_cap_mn)],['Paid-up (mn)',fmtInt(c.paid_up_capital_mn)],['Face value',fmt(c.face_value)],['Listed',c.listing_year||'—']
            ].map(([k,v])=><div key={k} className="bg-panel rounded-lg p-3 border border-line"><div className="text-[10px] text-slate-500 uppercase">{k}</div><div className="text-sm font-semibold tnum mt-0.5">{v}</div></div>)}
          </div>
          <div className="mt-4 bg-panel rounded-lg p-4 border border-line">
            <div className="text-xs text-slate-500 uppercase mb-2 font-semibold">Trade levels</div>
            <div className="grid grid-cols-4 gap-2 text-center text-sm">
              <div><div className="text-[10px] text-slate-500">Support</div><div className="tnum">{fmt(c.levels?.support)}</div></div>
              <div><div className="text-[10px] text-slate-500">Resistance</div><div className="tnum">{fmt(c.levels?.resistance)}</div></div>
              <div><div className="text-[10px] text-slate-500">Stop</div><div className="tnum text-down">{fmt(c.levels?.stop)}</div></div>
              <div><div className="text-[10px] text-slate-500">Target</div><div className="tnum text-up">{fmt(c.levels?.target)}</div></div>
            </div>
            <div className="text-xs text-slate-500 mt-3">52-week range: <span className="text-slate-300 tnum">{c.moving_range_52w||'—'}</span></div>
          </div>
          <div className="mt-4 bg-panel rounded-lg p-4 border border-line">
            <div className="text-xs text-slate-500 uppercase mb-1 font-semibold">Dividend history</div>
            <div className="text-sm text-slate-300">{c.dividend_history||'—'}</div>
          </div>
        </div>}
      </div>
    </div>
  );
}

/* ---------- tabs ---------- */
function Overview({ov, prices, onPick}) {
  const movers = useMemo(()=>{
    const liq = prices.filter(p=>(p.value_mn||0)>=1 && p.pct_change!=null);
    const g=[...liq].sort((a,b)=>b.pct_change-a.pct_change).slice(0,8);
    const l=[...liq].sort((a,b)=>a.pct_change-b.pct_change).slice(0,8);
    const a=[...prices].sort((x,y)=>(y.value_mn||0)-(x.value_mn||0)).slice(0,8);
    return {g,l,a};
  },[prices]);
  const b=ov.breadth;
  const List=({title,rows,color})=>(
    <div className="bg-panel border border-line rounded-xl p-4">
      <div className="text-sm font-semibold mb-2">{title}</div>
      <div className="space-y-1">{rows.map(r=>(
        <div key={r.code} className="flex justify-between items-center text-sm hover:bg-panel2 rounded px-1.5 py-1 cursor-pointer" onClick={()=>onPick(r.code)}>
          <span className="font-medium">{r.code}</span>
          <span className="flex gap-3 tnum"><span className="text-slate-400">{fmt(r.ltp)}</span><span className={color||upDown(r.pct_change)}>{sign(r.pct_change)}{fmt(r.pct_change,1)}%</span></span>
        </div>))}
      </div>
    </div>
  );
  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <KPI label="Market" value={ov.regime} tone={ov.regime==='BULLISH'?'up':ov.regime==='BEARISH'?'down':'amber'} sub={`${b.total} shares traded`}/>
        <KPI label="Advances / Declines" value={`${b.adv} / ${b.dec}`} tone={b.adv>b.dec?'up':'down'} sub={`${(b.adv/(b.adv+b.dec)*100||0).toFixed(0)}% advancing`}/>
        <KPI label="Value Traded" value={fmt(b.value_mn,0)} sub="million BDT"/>
        <KPI label="Buy / Watch / Avoid" value={`${ov.buy.length} / ${ov.watch.length} / ${ov.avoid.length}`} sub="from screen"/>
      </div>
      <div className="grid lg:grid-cols-3 gap-4">
        <div className="bg-panel border border-line rounded-xl p-4">
          <div className="text-sm font-semibold mb-1">Market breadth</div>
          <BreadthDonut b={b}/>
          <div className="flex justify-center gap-4 text-xs mt-1">
            <span className="text-up">● Adv {b.adv}</span><span className="text-down">● Dec {b.dec}</span><span className="text-slate-400">● Unch {Math.max(0,b.total-b.adv-b.dec)}</span>
          </div>
        </div>
        <List title="Top gainers" rows={movers.g} color="text-up"/>
        <List title="Top losers" rows={movers.l} color="text-down"/>
      </div>
      <List title="Most active by value" rows={movers.a}/>
    </div>
  );
}

function Screener({ov, onPick}) {
  return (
    <div className="space-y-6">
      <section>
        <h3 className="text-up font-bold mb-3 flex items-center gap-2">▲ BUY CANDIDATES <span className="text-xs text-slate-500 font-normal">momentum on volume</span></h3>
        {ov.buy.length? <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">{ov.buy.map(r=><Candidate key={r.code} r={r} kind="buy" onPick={onPick}/>)}</div>
          : <div className="text-slate-500 text-sm">No clean buy setups today. Stay patient.</div>}
      </section>
      <section>
        <h3 className="text-accent font-bold mb-3 flex items-center gap-2">◆ WATCHLIST <span className="text-xs text-slate-500 font-normal">wait for entry</span></h3>
        {ov.watch.length? <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">{ov.watch.map(r=><Candidate key={r.code} r={r} kind="watch" onPick={onPick}/>)}</div>
          : <div className="text-slate-500 text-sm">Nothing on watch.</div>}
      </section>
      <section>
        <h3 className="text-down font-bold mb-3">▼ AVOID / RISK</h3>
        <div className="bg-panel border border-line rounded-xl divide-y divide-line">
          {ov.avoid.map(r=>(
            <div key={r.code} className="flex justify-between items-center px-4 py-2 text-sm cursor-pointer hover:bg-panel2" onClick={()=>onPick(r.code)}>
              <span className="font-medium">{r.code}</span>
              <span className="text-slate-400 text-xs">{r.reason}</span>
              <span className={"tnum "+((r.value_mn||0)<0.5?'text-slate-500':upDown(r.pct))}>{(r.value_mn||0)<0.5?'no trade':sign(r.pct)+fmt(r.pct,1)+'%'}</span>
            </div>))}
        </div>
      </section>
    </div>
  );
}

function Shares({prices, onPick}) {
  const [q,setQ]=useState(''); const [tag,setTag]=useState('ALL'); const [sort,setSort]=useState({k:'value_mn',dir:-1});
  const tags=['ALL','BUY-WATCH','WATCH-DIP','WAIT','HOLD','AVOID'];
  const rows=useMemo(()=>{
    let r=prices.filter(p=>(tag==='ALL'||p.tag===tag) && p.code.toLowerCase().includes(q.toLowerCase()));
    r=[...r].sort((a,b)=>{const x=a[sort.k]??-1e9,y=b[sort.k]??-1e9; return (x<y?-1:x>y?1:0)*sort.dir;});
    return r;
  },[prices,q,tag,sort]);
  const Th=({k,label,right})=>(
    <th className={"px-3 py-2 cursor-pointer select-none hover:text-white "+(right?'text-right':'text-left')} onClick={()=>setSort(s=>({k,dir:s.k===k?-s.dir:-1}))}>
      {label}{sort.k===k?(sort.dir<0?' ▾':' ▴'):''}
    </th>);
  return (
    <div className="bg-panel border border-line rounded-xl overflow-hidden">
      <div className="flex flex-wrap gap-3 items-center p-3 border-b border-line">
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search ticker…" className="bg-panel2 border border-line rounded-lg px-3 py-1.5 text-sm w-44 outline-none focus:border-accent"/>
        <div className="flex gap-1">{tags.map(t=><button key={t} onClick={()=>setTag(t)} className={"text-xs px-2.5 py-1 rounded-lg border "+(tag===t?'bg-accent/20 border-accent text-accent':'border-line text-slate-400 hover:text-white')}>{t}</button>)}</div>
        <span className="text-xs text-slate-500 ml-auto">{rows.length} shares</span>
      </div>
      <div className="overflow-auto max-h-[64vh]">
        <table className="w-full text-sm">
          <thead className="text-[11px] uppercase text-slate-500 bg-panel2 sticky top-0">
            <tr><Th k="code" label="Code"/><Th k="ltp" label="LTP" right/><Th k="pct_change" label="Chg%" right/><Th k="high" label="High" right/><Th k="low" label="Low" right/><Th k="value_mn" label="Value(mn)" right/><Th k="volume" label="Volume" right/><th className="px-3 py-2 text-right">Tag</th></tr>
          </thead>
          <tbody>
            {rows.map(r=>(
              <tr key={r.code} className="border-t border-line/60 hover:bg-panel2 cursor-pointer" onClick={()=>onPick(r.code)}>
                <td className="px-3 py-1.5 font-medium">{r.code}</td>
                <td className="px-3 py-1.5 text-right tnum">{fmt(r.ltp)}</td>
                <td className={"px-3 py-1.5 text-right tnum "+upDown(r.pct_change)}>{sign(r.pct_change)}{fmt(r.pct_change,1)}</td>
                <td className="px-3 py-1.5 text-right tnum text-slate-400">{fmt(r.high)}</td>
                <td className="px-3 py-1.5 text-right tnum text-slate-400">{fmt(r.low)}</td>
                <td className="px-3 py-1.5 text-right tnum">{fmt(r.value_mn,1)}</td>
                <td className="px-3 py-1.5 text-right tnum text-slate-400">{fmtInt(r.volume)}</td>
                <td className="px-3 py-1.5 text-right"><Tag t={r.tag}/></td>
              </tr>))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Portfolio({onPick}) {
  const [data,setData]=useState(null); const [rows,setRows]=useState([]); const [saving,setSaving]=useState(false);
  const load=useCallback(()=>api('/api/portfolio').then(d=>{setData(d); setRows((d.positions||[]).map(p=>({code:p.code,quantity:p.quantity,buy_price:p.buy_price})));}),[]);
  useEffect(()=>{load();},[load]);
  const save=()=>{setSaving(true); fetch('/api/portfolio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({holdings:rows.filter(r=>r.code)})}).then(r=>r.json()).then(d=>{setData(d); setSaving(false);});};
  const upd=(i,k,v)=>setRows(rs=>rs.map((r,j)=>j===i?{...r,[k]:v}:r));
  const add=()=>setRows(rs=>[...rs,{code:'',quantity:0,buy_price:0}]);
  const del=(i)=>setRows(rs=>rs.filter((_,j)=>j!==i));
  if(!data) return <Spinner label="Loading portfolio…"/>;
  const s=data.summary||{};
  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <KPI label="Invested" value={fmt(s.invested,0)} sub="BDT"/>
        <KPI label="Market value" value={fmt(s.market_value,0)} sub="BDT"/>
        <KPI label="Unrealized P&L" value={fmt(s.unrealized_pnl,0)} tone={s.unrealized_pnl>=0?'up':'down'} sub="BDT"/>
        <KPI label="Return" value={(s.return_pct>=0?'+':'')+fmt(s.return_pct,1)+'%'} tone={s.return_pct>=0?'up':'down'}/>
      </div>
      <div className="bg-panel border border-line rounded-xl overflow-hidden">
        <div className="flex items-center justify-between p-3 border-b border-line">
          <span className="text-sm font-semibold">Holdings — live P&amp;L</span>
          <div className="flex gap-2">
            <button onClick={add} className="text-xs px-3 py-1.5 rounded-lg border border-line text-slate-300 hover:text-white">+ Add row</button>
            <button onClick={save} disabled={saving} className="text-xs px-3 py-1.5 rounded-lg bg-accent/20 border border-accent text-accent hover:bg-accent/30">{saving?'Saving…':'Save & recompute'}</button>
          </div>
        </div>
        <div className="overflow-auto">
          <table className="w-full text-sm">
            <thead className="text-[11px] uppercase text-slate-500 bg-panel2">
              <tr><th className="px-3 py-2 text-left">Code</th><th className="px-3 py-2 text-right">Qty</th><th className="px-3 py-2 text-right">Buy</th><th className="px-3 py-2 text-right">LTP</th><th className="px-3 py-2 text-right">Mkt val</th><th className="px-3 py-2 text-right">P&L</th><th className="px-3 py-2 text-right">P&L%</th><th className="px-3 py-2 text-right">Day%</th><th className="px-3 py-2 text-right">Tag</th><th className="px-3 py-2"></th></tr>
            </thead>
            <tbody>
              {(data.positions||[]).map((p,i)=>(
                <tr key={i} className="border-t border-line/60 hover:bg-panel2">
                  <td className="px-3 py-1.5"><input value={rows[i]?.code??p.code} onChange={e=>upd(i,'code',e.target.value.toUpperCase())} className="bg-transparent w-20 outline-none font-medium cursor-pointer hover:text-accent" onDoubleClick={()=>onPick(p.code)}/></td>
                  <td className="px-3 py-1.5 text-right"><input type="number" value={rows[i]?.quantity??p.quantity} onChange={e=>upd(i,'quantity',+e.target.value)} className="bg-transparent w-20 text-right outline-none tnum"/></td>
                  <td className="px-3 py-1.5 text-right"><input type="number" value={rows[i]?.buy_price??p.buy_price} onChange={e=>upd(i,'buy_price',+e.target.value)} className="bg-transparent w-20 text-right outline-none tnum"/></td>
                  <td className="px-3 py-1.5 text-right tnum">{fmt(p.ltp)}</td>
                  <td className="px-3 py-1.5 text-right tnum">{fmtInt(p.market_value)}</td>
                  <td className={"px-3 py-1.5 text-right tnum "+upDown(p.unrealized_pnl)}>{fmtInt(p.unrealized_pnl)}</td>
                  <td className={"px-3 py-1.5 text-right tnum "+upDown(p.pnl_pct)}>{sign(p.pnl_pct)}{fmt(p.pnl_pct,1)}%</td>
                  <td className={"px-3 py-1.5 text-right tnum "+upDown(p.day_change_pct)}>{sign(p.day_change_pct)}{fmt(p.day_change_pct,1)}%</td>
                  <td className="px-3 py-1.5 text-right"><Tag t={p.tag}/></td>
                  <td className="px-3 py-1.5 text-right"><button onClick={()=>del(i)} className="text-slate-600 hover:text-down">✕</button></td>
                </tr>))}
            </tbody>
          </table>
        </div>
      </div>
      <p className="text-xs text-slate-600">Edit qty / buy price inline, add rows, then <b>Save &amp; recompute</b>. Stored in data/portfolio.csv.</p>
    </div>
  );
}

/* ---------- app shell ---------- */
function App() {
  const [tab,setTab]=useState('overview');
  const [ov,setOv]=useState(null); const [prices,setPrices]=useState(null);
  const [buy,setBuy]=useState(6); const [watch,setWatch]=useState(6);
  const [loading,setLoading]=useState(true); const [err,setErr]=useState(null);
  const [updated,setUpdated]=useState(null); const [pick,setPick]=useState(null);
  const [pdf,setPdf]=useState(null); const [genPdf,setGenPdf]=useState(false);

  const load=useCallback(()=>{
    setLoading(true); setErr(null);
    Promise.all([api(`/api/overview?buy=${buy}&watch=${watch}`), api('/api/prices')])
      .then(([o,p])=>{ if(o.error){setErr(o.error);return;} setOv(o); setPrices(p.prices); setUpdated(new Date()); })
      .catch(e=>setErr(''+e)).finally(()=>setLoading(false));
  },[buy,watch]);
  useEffect(()=>{load();},[load]);

  const makePdf=()=>{setGenPdf(true); api(`/api/report?buy=${buy}&watch=${watch}`).then(d=>{setPdf(d.url); setGenPdf(false); window.open(d.url,'_blank');}).catch(()=>setGenPdf(false));};

  const tabs=[['overview','Overview'],['screener','Screener'],['shares','All Shares'],['portfolio','Portfolio']];
  return (
    <div>
      <header className="sticky top-0 z-30 bg-ink/90 backdrop-blur border-b border-line">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-accent to-up flex items-center justify-center font-bold text-white text-sm">৳</div>
            <div><div className="font-extrabold tracking-tight leading-none">DSE Terminal</div><div className="text-[10px] text-slate-500">Dhaka Stock Exchange</div></div>
          </div>
          {ov && <span className={"text-xs font-semibold px-2.5 py-1 rounded-full border "+(ov.regime==='BULLISH'?'text-up border-up/40 bg-up/10':ov.regime==='BEARISH'?'text-down border-down/40 bg-down/10':'text-amber border-amber/40 bg-amber/10')}>● {ov.regime}</span>}
          <div className="ml-auto flex items-center gap-2 text-xs">
            {updated && <span className="text-slate-500 hidden sm:flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-up live"></span>{updated.toLocaleTimeString()}</span>}
            <label className="text-slate-500">Buy</label>
            <input type="number" min="1" max="20" value={buy} onChange={e=>setBuy(+e.target.value)} className="w-12 bg-panel2 border border-line rounded px-2 py-1 tnum"/>
            <label className="text-slate-500">Watch</label>
            <input type="number" min="0" max="20" value={watch} onChange={e=>setWatch(+e.target.value)} className="w-12 bg-panel2 border border-line rounded px-2 py-1 tnum"/>
            <button onClick={load} className="px-3 py-1.5 rounded-lg border border-line hover:border-accent hover:text-accent">↻ Refresh</button>
            <button onClick={makePdf} disabled={genPdf} className="px-3 py-1.5 rounded-lg bg-accent/20 border border-accent text-accent hover:bg-accent/30">{genPdf?'Building…':'⤓ PDF'}</button>
          </div>
        </div>
        <div className="max-w-7xl mx-auto px-4 flex gap-1">
          {tabs.map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={"px-4 py-2 text-sm font-medium border-b-2 -mb-px "+(tab===k?'border-accent text-white':'border-transparent text-slate-500 hover:text-slate-300')}>{l}</button>)}
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 py-6">
        {err && <div className="bg-down/10 border border-down/40 text-down rounded-xl p-4 mb-4 text-sm">⚠ {err} — is the API server running? Check the terminal.</div>}
        {loading && !ov && <Spinner/>}
        {ov && prices && <>
          {tab==='overview' && <Overview ov={ov} prices={prices} onPick={setPick}/>}
          {tab==='screener' && <Screener ov={ov} onPick={setPick}/>}
          {tab==='shares' && <Shares prices={prices} onPick={setPick}/>}
          {tab==='portfolio' && <Portfolio onPick={setPick}/>}
        </>}
        <footer className="mt-10 text-center text-[11px] text-slate-600 border-t border-line pt-4">
          Data scraped from dsebd.org (delayed / end-of-day). Rule-based screen — <b>educational only, NOT financial advice.</b> Verify on the official DSE site before trading.
          {pdf && <span> · Last PDF: <a href={pdf} target="_blank" className="text-accent underline">{pdf.split('/').pop()}</a></span>}
        </footer>
      </main>

      {pick && <StockModal code={pick} onClose={()=>setPick(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
